<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Home Gym</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: una sola columna estilo app de iPhone, listas agrupadas en tarjetas y barra de pestañas fija abajo */
:root{
  --bg:#F2F2F6; --card:#FFFFFF; --fg:#141417; --muted:#6D6D76; --line:#E2E2E8;
  --accent:#0A6CF0; --accent-soft:rgba(10,108,240,.12); --ok:#2E9E58; --ok-soft:rgba(46,158,88,.14);
  --g-pecho:#E8344E; --g-espalda:#5B4FE0; --g-piernas:#21A35A; --g-hombros:#F07A12;
  --g-brazos:#B44AD8; --g-core:#D9A400; --g-cardio:#0E9EA8; --g-otro:#7C7C86;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1F; --fg:#F3F3F5; --muted:#9C9CA5; --line:#2E2E33;
  --accent:#3D8BFF; --accent-soft:rgba(61,139,255,.2); --ok:#3DC46E; --ok-soft:rgba(61,196,110,.18);
  --g-pecho:#FF5A6E; --g-espalda:#8077FF; --g-piernas:#3DCB76; --g-hombros:#FF9533;
  --g-brazos:#CF73F2; --g-core:#F2C230; --g-cardio:#2FC6CF; --g-otro:#A0A0AA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1F; --fg:#F3F3F5; --muted:#9C9CA5; --line:#2E2E33;
  --accent:#3D8BFF; --accent-soft:rgba(61,139,255,.2); --ok:#3DC46E; --ok-soft:rgba(61,196,110,.18);
  --g-pecho:#FF5A6E; --g-espalda:#8077FF; --g-piernas:#3DCB76; --g-hombros:#FF9533;
  --g-brazos:#CF73F2; --g-core:#F2C230; --g-cardio:#2FC6CF; --g-otro:#A0A0AA; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}
button,summary,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
html,body{min-height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.top h1{font-family:var(--display);font-size:34px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--accent);flex:none}
.icon-btn svg{width:20px;height:20px}
.back{color:var(--accent);display:inline-flex;align-items:center;gap:2px;font-size:17px;margin:4px 0 8px}
.section-h{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:24px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:12px}
.banner b{display:block}
.banner button{color:var(--accent);font-weight:600;white-space:nowrap}
/* constancia */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:2px}
.stat.hl .v{color:var(--ok)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.dot{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:transparent}
.dot.on{background:var(--ok);color:#fff}
.dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.dot svg{width:15px;height:15px}
.primary{width:100%;background:var(--accent);color:#fff;font-weight:600;font-size:17px;border-radius:14px;padding:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.secondary{background:var(--card);color:var(--accent);font-weight:600;border-radius:12px;padding:12px 14px}
.danger{color:#E5484D;font-weight:600}
/* listas */
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.row.has-thumb+.row::before,.row.has-thumb+.row.has-thumb::before{left:74px}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:14px;color:var(--muted);text-align:right;flex:none}
.row .r b{display:block;color:var(--fg);font-size:16px}
.chev{color:var(--muted);opacity:.6;flex:none;width:8px}
.thumb{width:48px;height:48px;border-radius:10px;flex:none;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:26px;height:26px}
.spark{width:56px;height:24px;flex:none}
.empty{color:var(--muted);text-align:center;padding:28px 12px;margin:0;font-size:15px}
/* detalle */
.hero-photo{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);margin-bottom:14px}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo .ph{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:15px}
.hero-photo svg{width:56px;height:56px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.note{font-size:15px;color:var(--muted);margin:10px 0 0}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:13px;font-weight:600;color:var(--fg)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chart-head{margin:14px 0 6px;min-height:68px}
.chart-head .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.chart-head .v{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.chart-head .v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
.chart-head .d{font-size:14px;color:var(--muted)}
#chart{width:100%;touch-action:pan-y}
#chart svg{display:block;width:100%}
#chart text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini-stats div{background:var(--card);border-radius:12px;padding:10px 12px}
.mini-stats span{font-size:12px;color:var(--muted);display:block;font-weight:600}
.mini-stats b{font-size:18px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;background:var(--bg);border-radius:8px;padding:3px 8px;color:var(--fg)}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-row>*{flex:1}
/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:18px;text-transform:capitalize}
.cal-head button{color:var(--accent);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:50%;font-size:15px;display:grid;place-items:center}
.cal button.on{background:var(--ok);color:#fff;font-weight:600}
.cal button.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal button.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.cal button.future{color:var(--muted);opacity:.5}
.cal-sum{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.cal-sum b{color:var(--fg)}
/* barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--accent)}
.tabs svg{width:25px;height:25px}
/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:1}
.sheet-h b{font-size:17px}
.sheet-h button{color:var(--accent);font-size:17px;min-width:70px}
.sheet-h button:last-child{font-weight:700;text-align:right}
.sheet-h button:first-child{text-align:left}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-left:4px}
.field input,.field select,.field textarea{background:var(--card);border:0;border-radius:12px;padding:12px 14px;font-size:17px;width:100%;min-width:0}
.field textarea{resize:none;min-height:70px}
.count{font-size:12px;color:var(--muted);text-align:right}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick .thumb{width:72px;height:72px;border-radius:12px}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:8px;align-items:center}
.set-row .n{color:var(--muted);font-weight:600;text-align:center}
.set-row input{text-align:center}
.set-row .x{color:var(--muted);font-size:22px;line-height:1}
.unit-h{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:8px;font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.thumb,.tag,.hero-photo{background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));margin-right:6px;vertical-align:1px}
.dd{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dd-h{font-size:14px;color:var(--muted);margin-bottom:10px}
.dd-h b{color:var(--fg);text-transform:capitalize}
.dd-row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.dd-row .l{color:var(--muted);font-weight:600}
.dd-bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);overflow:hidden;min-width:0}
.dd-bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--accent))}
.dd-row .v{white-space:nowrap;color:var(--muted)}
.dd-row .v b{color:var(--fg);font-size:16px}
.dd-tot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px}
.dd-tot b{color:var(--fg)}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:12px 0 0}
.dot.on{background:var(--ring,var(--ok))}
.cal button.on{background:transparent;color:var(--fg);font-weight:700}
.cal button{position:relative;align-content:center}
.cal .pips{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:2px}
.cal .pips i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg)}
.due{font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:1px}
.fold{margin-top:24px}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:13px 14px;font-weight:600}
.fold summary::-webkit-details-marker{display:none}
.fold summary .chev{transition:transform .2s;width:8px}
.fold[open] summary{border-radius:14px 14px 0 0;border-bottom:1px solid var(--line)}
.fold[open] summary .chev{transform:rotate(90deg)}
.fold[open] .list{border-radius:0 0 14px 14px}
.fold summary small{color:var(--muted);font-weight:400;font-size:14px;margin-left:auto;margin-right:10px}
@media (prefers-reduced-motion:reduce){.fold summary .chev{transition:none}}
.gch{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--fg);margin-right:10px;white-space:nowrap}
.gch i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.row .chips{display:flex;flex-wrap:wrap;gap:2px 0}
.dname{font-weight:600;min-width:54px;flex:none}
.fold-note{font-size:13px;color:var(--muted);padding:4px 14px 12px}
.fold-sub{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:16px 14px 4px;border-top:1px solid var(--line)}
.row.link{color:var(--accent);font-weight:600;justify-content:center;border-top:1px solid var(--line)}
.row.link::before{display:none}
.fold summary small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:12px}
.sheet.still{animation:none}
.rt-day{background:var(--card);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s}
.rt-day.drag{box-shadow:0 10px 28px rgba(0,0,0,.22);transform:scale(1.02);position:relative;z-index:2}
.rt-top{display:flex;align-items:center;gap:8px}
.rt-top b{flex:1}
.handle{touch-action:none;color:var(--muted);width:36px;height:36px;display:grid;place-items:center;cursor:grab;flex:none;-webkit-user-select:none;user-select:none}
.handle svg{width:20px;height:20px}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{font-size:14px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.gpick button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.gpick button.on{background:var(--c);color:#fff}
.gpick button.on i{background:#fff}
@media (prefers-reduced-motion:reduce){.rt-day{transition:none}}
.confirm{background:#E5484D;color:#fff;border-radius:12px;padding:12px 14px;font-weight:600}
</style>
</head>
<body>

<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>
<input type="file" id="photo-input" accept="image/*" hidden>
<input type="file" id="import-input" accept=".json,application/json" hidden>

<script>
(function(){
const KEY='homegym-v1';
const GROUPS=['Pecho','Espalda','Piernas','Hombros','Brazos','Core','Cardio','Otro'];
const GKEY={Pecho:'pecho',Espalda:'espalda',Piernas:'piernas',Hombros:'hombros',Brazos:'brazos',Core:'core',Cardio:'cardio',Otro:'otro'};
const gc=g=>'--c:var(--g-'+(GKEY[g]||'otro')+')';
const ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3.5 9.5v5M18 7v10M20.5 9.5v5M6 12h12"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>',

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const diff=(a,b)=>Math.round((b-a)/864e5);
const fShort=s=>parse(s).toLocaleDateString('es',{day:'numeric',month:'short'}).replace('.','');
const fLong=s=>parse(s).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
const nf=new Intl.NumberFormat('es');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function sample(){
  const t=today(),start=addDays(t,-48);
  const ex=[
    {id:'e1',name:'Press de banca',group:'Pecho',note:'Agarre un poco más ancho que los hombros.'},
    {id:'e2',name:'Sentadilla',group:'Piernas',note:''},
    {id:'e3',name:'Remo con mancuerna',group:'Espalda',note:'Peso por mancuerna.'},
    {id:'e4',name:'Press militar',group:'Hombros',note:''}];
  const base={e1:115,e2:135,e3:40,e4:65},inc={e1:5,e2:10,e3:5,e4:5};
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const logs=[];let n=0;
  for(let i=0;i<48;i++){
    const d=addDays(start,i);if(![1,3,5].includes(d.getDay()))continue;if(rnd()<.15)continue;
    const plan=n%2?['e2','e4']:['e1','e3'];n++;
    plan.forEach(id=>{const k=logs.filter(l=>l.exId===id).length;const w=base[id]+inc[id]*Math.floor(k/2);
      logs.push({id:uid(),exId:id,date:iso(d),sets:[{w,r:10},{w,r:rnd()<.5?10:9},{w,r:rnd()<.5?8:9}],note:''})});
  }
  return{v:1,sample:true,start:iso(start),exercises:ex.map(e=>({...e,photo:''})),logs,routine:{days:[{id:'r1',groups:['Pecho','Espalda']},{id:'r2',groups:['Piernas','Hombros']}],next:null}};
}
let S=null;
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('homegym',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)})},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error)})}};

  if(!S||!Array.isArray(S.exercises)||!Array.isArray(S.logs))S=sample();
  if(!S.routine)S.routine=S.sample?{days:[{id:'r1',groups:['Pecho','Espalda']},{id:'r2',groups:['Piernas','Hombros']}],next:null}:{days:[],next:null};
}

const getEx=id=>S.exercises.find(e=>e.id===id);
const exLogs=id=>S.logs.filter(l=>l.exId===id).sort((a,b)=>a.date<b.date?-1:1);
const maxW=l=>Math.max(...l.sets.map(s=>+s.w||0));
const vol=l=>l.sets.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0);
const trainedSet=()=>new Set(S.logs.map(l=>l.date));
function setsText(l){
  const same=l.sets.every(s=>s.w==l.sets[0].w&&s.r==l.sets[0].r);
  if(same)return l.sets.length+' × '+l.sets[0].r+' · '+nf.format(l.sets[0].w)+' lb';
  const sameW=l.sets.every(s=>s.w==l.sets[0].w);
  if(sameW)return l.sets.map(s=>s.r).join(', ')+' reps · '+nf.format(l.sets[0].w)+' lb';
  return l.sets.map(s=>nf.format(s.w)+'×'+s.r).join(', ');
}

function groupsOn(d){const out=[];S.logs.forEach(l=>{if(l.date!==d)return;const e=getEx(l.exId);if(e&&!out.includes(e.group))out.push(e.group)});return out.sort((a,b)=>GROUPS.indexOf(a)-GROUPS.indexOf(b))}
function ringStyle(gs){if(!gs.length)return '';const n=gs.length;return '--ring:conic-gradient('+gs.map((g,i)=>'var(--g-'+(GKEY[g]||'otro')+') '+(i/n*100).toFixed(1)+'% '+((i+1)/n*100).toFixed(1)+'%').join(',')+')'}
function foldOpen(){try{return localStorage.getItem('homegym-fold')==='1'}catch(e){return false}}
document.addEventListener('toggle',e=>{if(e.target.id==='fold-groups'){try{localStorage.setItem('homegym-fold',e.target.open?'1':'0')}catch(err){}}},true);
const L2=i=>String.fromCharCode(65+i);
function routineInfo(){
  const days=(S.routine&&S.routine.days)||[];if(!days.length)return null;
  const byDate={};S.logs.forEach(l=>{const e=getEx(l.exId);if(!e)return;(byDate[l.date]=byDate[l.date]||new Set()).add(e.group)});
  const last=days.map(d=>{let best=null;for(const dt in byDate){const hit=d.groups.filter(g=>byDate[dt].has(g)).length;if(hit>=Math.ceil(d.groups.length/2)&&(!best||dt>best))best=dt}return best});
  const ov=S.routine.next,manual=ov!=null&&ov<days.length;let nx=0;
  if(manual)nx=ov;else{for(let i=1;i<days.length;i++){if((last[i]||'')<(last[nx]||''))nx=i}}
  return{days,last,nx,manual};
}

function spark(ex){
  const v=exLogs(ex.id).slice(-8).map(maxW);if(v.length<2)return '';
  const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;
  const p=v.map((y,i)=>(i/(v.length-1)*52+2).toFixed(1)+','+(20-(y-mn)/r*16).toFixed(1)).join(' ');
  return '<svg class="spark" style="'+gc(ex.group)+'" viewBox="0 0 56 24" aria-hidden="true"><polyline points="'+p+'" fill="none" stroke="var(--c)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function niceStep(raw){if(raw<=0)return 1;const p=10**Math.floor(Math.log10(raw)),n=raw/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function drawChart(){
  const el=document.getElementById('chart'),head=document.getElementById('chart-head');if(!el||!head)return;
  const ex=getEx(ui.ex),logs=exLogs(ex.id),end=today(),isLine=ui.metric==='max',isReps=ui.metric==='reps',unit=isReps?'reps':'lb';
  const dd=document.getElementById('day-detail');
  const span0={'1M':30,'3M':90}[ui.range];
  let start=span0?addDays(end,-(span0-1)):(logs[0]?addDays(parse(logs[0].date),-2):addDays(end,-29));
  const pts=logs.filter(l=>parse(l.date)>=start).map(l=>({d:l.date,l,v:isLine?maxW(l):isReps?l.sets.reduce((a,s)=>a+(+s.r||0),0):vol(l)}));
  const range=fShort(iso(start))+' – '+fShort(iso(end))+' '+end.getFullYear();
  if(!pts.length){head.innerHTML='<div class="k">'+(isLine?'Máximo':'Promedio')+'</div><div class="v">—</div><div class="d">'+range+'</div>';el.innerHTML='<p class="empty">Sin registros en este periodo.</p>';if(dd)dd.innerHTML='';return}
  const sel=pts.find(p=>p.d===ui.sel);
  if(sel)head.innerHTML='<div class="k">'+(isLine?'Peso máximo':isReps?'Repeticiones totales':'Volumen')+'</div><div class="v">'+nf.format(sel.v)+'<small>'+unit+'</small></div><div class="d" style="text-transform:capitalize">'+esc(fLong(sel.d))+'</div>';
  else{const v=isLine?Math.max(...pts.map(p=>p.v)):Math.round(pts.reduce((a,p)=>a+p.v,0)/pts.length);
    head.innerHTML='<div class="k">'+(isLine?'Máximo del periodo':'Promedio por sesión')+'</div><div class="v">'+nf.format(v)+'<small>'+unit+'</small></div><div class="d">'+range+'</div>';}
  const W=Math.max(240,el.clientWidth||320),H=190,pl=4,pr=42,pt=10,pb=24,pw=W-pl-pr,ph=H-pt-pb;
  const vals=pts.map(p=>p.v),mx=Math.max(...vals),mn=Math.min(...vals);
  let lo,hi,step;
  if(isLine){step=niceStep(Math.max(mx-mn,mx*.15,1)/3);lo=Math.max(0,Math.floor(mn*.95/step)*step);hi=Math.ceil(mx*1.03/step)*step;if(hi<=lo)hi=lo+step}
  else{step=niceStep(mx/3);lo=0;hi=Math.ceil(mx/step)*step||step}
  const span=Math.max(1,diff(start,end));
  const bw=Math.min(16,Math.max(4,pw/(span+1)*.62));
  const X=d=>pl+bw/2+diff(start,parse(d))/span*(pw-bw);
  const Y=v=>pt+ph-(v-lo)/(hi-lo)*ph;
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=step){const y=Y(v).toFixed(1);
    g+='<line x1="'+pl+'" x2="'+(pl+pw)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"'+(v===lo?'':' stroke-dasharray="2 3"')+'/>'+
       '<text x="'+(W-2)+'" y="'+(+y+4)+'" text-anchor="end">'+nf.format(v)+'</text>';}
  const xl=[iso(start),iso(addDays(start,Math.round(span/2))),iso(end)];
  xl.forEach((d,i)=>{g+='<text x="'+(i===0?pl:i===1?pl+pw/2:pl+pw)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===1?'middle':'end')+'">'+fShort(d)+'</text>'});
  let marks='';
  if(sel){const x=X(sel.d).toFixed(1);marks+='<line x1="'+x+'" x2="'+x+'" y1="'+pt+'" y2="'+(pt+ph)+'" stroke="var(--muted)" stroke-width="1"/>'}
  if(isLine){
    const p=pts.map(q=>X(q.d).toFixed(1)+','+Y(q.v).toFixed(1));
    marks+='<path d="M'+p.join(' L')+' L'+X(pts[pts.length-1].d).toFixed(1)+','+(pt+ph)+' L'+X(pts[0].d).toFixed(1)+','+(pt+ph)+'Z" fill="color-mix(in srgb,var(--c) 16%,transparent)" stroke="none"/>';
    marks+='<polyline points="'+p.join(' ')+'" fill="none" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(q=>{const on=sel&&sel.d===q.d;marks+='<circle cx="'+X(q.d).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="'+(on?6:3.5)+'" fill="'+(on?'var(--card)':'var(--c)')+'" stroke="var(--c)" stroke-width="'+(on?3:0)+'"/>'});
  }else if(isReps){
    const op=[1,.68,.46,.3];
    pts.forEach(q=>{const x=X(q.d)-bw/2,dim=sel&&sel.d!==q.d;let acc=0;const n=q.l.sets.length;
      q.l.sets.forEach((s,i)=>{const r=+s.r||0;const y0=Y(acc),y1=Y(acc+r);acc+=r;const top=i===n-1;const gap=top?0:1.5;
        const h=Math.max(0,y0-y1-gap);
        marks+='<rect x="'+x.toFixed(1)+'" y="'+(y1+gap).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+(top?Math.min(3,bw/2):0)+'" fill="var(--c)" opacity="'+((op[i]??.25)*(dim?.4:1))+'"/>'});});
  }else{
    pts.forEach(q=>{const x=X(q.d)-bw/2,y=Y(q.v),h=pt+ph-y,r=Math.min(3,bw/2);const dim=sel&&sel.d!==q.d;
      marks+='<path d="M'+x+','+(y+h)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+bw-r)+' Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+' V'+(y+h)+'Z" fill="var(--c)" opacity="'+(dim?.4:1)+'"/>'});
  }
  let hits='';const hw=Math.max(bw,22);
  pts.forEach(q=>{hits+='<rect data-act="sel" data-v="'+q.d+'" x="'+(X(q.d)-hw/2).toFixed(1)+'" y="0" width="'+hw+'" height="'+H+'" fill="transparent" style="cursor:pointer"/>'});
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="Gráfica de '+(isLine?'peso máximo':isReps?'repeticiones por serie':'volumen')+' de '+esc(ex.name)+'">'+g+marks+hits+'</svg>';
  if(dd){
    if(sel){const sets=sel.l.sets,mr=Math.max(...sets.map(s=>+s.r||0),1),tot=sets.reduce((a,s)=>a+(+s.r||0),0),op=[1,.68,.46,.3];
      dd.innerHTML='<div class="dd"><div class="dd-h">Series del <b>'+esc(fLong(sel.d))+'</b></div>'+
        sets.map((s,i)=>'<div class="dd-row"><span class="l">Serie '+(i+1)+'</span><div class="dd-bar"><i style="width:'+((+s.r||0)/mr*100).toFixed(0)+'%;opacity:'+(isReps?(op[i]??.25):1)+'"></i></div><span class="v"><b>'+s.r+'</b> reps · '+nf.format(s.w)+' lb</span></div>').join('')+
        '<div class="dd-tot"><span>Total</span><span><b>'+tot+'</b> reps · <b>'+nf.format(vol(sel.l))+'</b> lb de volumen</span></div>'+
        (sel.l.note?'<p class="note" style="margin-top:8px">'+esc(sel.l.note)+'</p>':'')+'</div>';}
    else dd.innerHTML='<p class="hint">Toca un día en la gráfica para ver cada serie.</p>';
  }
}

function openSheet(kind){ui.sheet=kind;renderSheet()}
function renderSheet(){
  const L=document.getElementById('layer');
  if(!ui.sheet){L.innerHTML='';return}
  const prev=L.querySelector('.sheet'),st=prev?prev.scrollTop:0;
  const html=ui.sheet==='ex'?sheetEx():ui.sheet==='log'?sheetLog():ui.sheet==='routine'?sheetRoutine():sheetSettings();
  L.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet'+(prev?' still':'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';
  if(prev)L.querySelector('.sheet').scrollTop=st;
}
function readSets(){
  const out=ui.draft.sets.map(s=>({...s}));
  document.querySelectorAll('#sets input').forEach(i=>{out[+i.dataset.set][i.dataset.f]=i.value});
  return out;
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  app.innerHTML=ui.tab==='home'?vHome():ui.tab==='ex'?vExercises():ui.tab==='detail'?vDetail():vCalendar();
  const cur=ui.tab==='detail'?'ex':ui.tab;
  document.getElementById('tabs').innerHTML=[['home','Hoy',ICON.home],['ex','Ejercicios',ICON.dumb],['cal','Calendario',ICON.cal]]
    .map(([k,l,i])=>'<button class="'+(cur===k?'on':'')+'" data-act="tab" data-v="'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+i+l+'</button>').join('');
  if(ui.tab==='detail')drawChart();
}
let tt;function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(tt);tt=setTimeout(()=>el.remove(),2200)}

/* ---------- acciones ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a==='scrim'){if(e.target===b){ui.sheet=null;ui.confirm=null;renderSheet()}return}
  if(a!=='del-ex'&&a!=='del-log'&&a!=='clear-sample'&&a!=='clear-all'&&ui.confirm){ui.confirm=null}
  switch(a){
    case 'tab':ui.tab=v;ui.calDay=null;render();window.scrollTo(0,0);break;
    case 'open-ex':ui.ex=id;ui.tab='detail';ui.sel=null;render();window.scrollTo(0,0);break;
    case 'back':ui.tab='ex';render();break;
    case 'metric':ui.metric=v;ui.sel=null;render();break;
    case 'range':ui.range=v;ui.sel=null;render();break;
    case 'sel':ui.sel=ui.sel===v?null:v;drawChart();break;
    case 'cal-prev':case 'cal-next':{let{y,m}=ui.cal;m+=a==='cal-next'?1:-1;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cal={y,m};ui.calDay=null;render();break}
    case 'cal-day':ui.calDay=ui.calDay===v?null:v;render();break;
    case 'settings':ui.pendingImport=null;openSheet('settings');break;
    case 'export':exportBackup();break;
    case 'import':document.getElementById('import-input').click();break;
    case 'import-cancel':ui.pendingImport=null;renderSheet();break;
    case 'import-ok':{const d=ui.pendingImport;if(!d)break;S={...d};delete S.exported;normalize();S.sample=false;save();ui.pendingImport=null;ui.sheet=null;renderSheet();ui.tab='home';render();toast('Respaldo importado');break}
    case 'edit-routine':ui.draft={days:S.routine.days.map(x=>({id:x.id,groups:[...x.groups]}))};if(!ui.draft.days.length)ui.draft.days=[{id:uid(),groups:[]}];openSheet('routine');break;
    case 'add-day':ui.draft.days.push({id:uid(),groups:[]});renderSheet();break;
    case 'rm-day':ui.draft.days.splice(+b.dataset.i,1);renderSheet();break;
    case 'tog-g':{const day=ui.draft.days[+b.dataset.i],g=b.dataset.g,k=day.groups.indexOf(g);if(k>=0)day.groups.splice(k,1);else day.groups.push(g);b.classList.toggle('on',k<0);b.setAttribute('aria-pressed',String(k<0));break}
    case 'set-next':{const R=routineInfo(),i=+b.dataset.i;if(!R)break;
      if(R.manual&&R.nx===i){S.routine.next=null;toast('De vuelta al orden de tu rutina')}else{S.routine.next=i;toast('Siguiente: '+R.days[i].groups.join(' + '))}save();render();break}
    case 'close':ui.sheet=null;renderSheet();break;
    case 'new-ex':ui.draft={name:'',group:'Pecho',note:'',photo:''};openSheet('ex');break;
    case 'edit-ex':{const ex=getEx(id);ui.draft={...ex};openSheet('ex');break}
    case 'pick-photo':syncExDraft();document.getElementById('photo-input').click();break;
    case 'rm-photo':syncExDraft();ui.draft.photo='';renderSheet();break;
    case 'log':{const exId=id||(ui.tab==='detail'?ui.ex:null)||(S.exercises[0]&&S.exercises[0].id)||'';
      const prev=exLogs(exId).pop();
      ui.draft={exId,date:iso(today()),note:'',sets:prev?prev.sets.map(s=>({w:s.w,r:s.r})):[{w:'',r:''}]};openSheet('log');break}
    case 'add-set':{const s=readSets();const l=s[s.length-1]||{w:'',r:''};s.push({w:l.w,r:l.r});ui.draft.sets=s;syncLogDraft();renderSheet();break}
    case 'rm-set':{const s=readSets();if(s.length>1){s.splice(+b.dataset.i,1)}ui.draft.sets=s;syncLogDraft();renderSheet();break}
    case 'del-ex':if(ui.confirm==='ex:'+id){S.exercises=S.exercises.filter(e=>e.id!==id);S.logs=S.logs.filter(l=>l.exId!==id);save();ui.confirm=null;ui.tab='ex';render();toast('Ejercicio eliminado')}else{ui.confirm='ex:'+id;render()}break;
    case 'del-log':if(ui.confirm==='log:'+id){S.logs=S.logs.filter(l=>l.id!==id);save();ui.confirm=null;render();toast('Registro borrado')}else{ui.confirm='log:'+id;render()}break;
    case 'clear-sample':if(ui.confirm==='sample'){S={v:1,sample:false,start:iso(today()),exercises:[],logs:[],routine:{days:[],next:null}};save();ui.confirm=null;ui.sheet=null;renderSheet();ui.tab='home';render();toast('Listo, empieza desde cero')}else{ui.confirm='sample';renderSheet()}break;
    case 'clear-all':if(ui.confirm==='all'){S={v:1,sample:false,start:iso(today()),exercises:[],logs:[],routine:{days:[],next:null}};save();ui.confirm=null;ui.sheet=null;renderSheet();ui.tab='home';render();toast('Datos borrados')}else{ui.confirm='all';renderSheet()}break;
  }
});
function syncExDraft(){const n=document.getElementById('ex-name');if(!n)return;ui.draft.name=n.value;ui.draft.group=document.getElementById('ex-group').value;ui.draft.note=document.getElementById('ex-note').value}
function syncLogDraft(){const x=document.getElementById('log-ex');if(!x)return;ui.draft.exId=x.value;ui.draft.date=document.getElementById('log-date').value;ui.draft.note=document.getElementById('log-note').value}

document.addEventListener('input',e=>{
  if(e.target.id==='ex-note'){const c=document.getElementById('note-count');if(c)c.textContent=e.target.value.length+'/140'}
  if(e.target.id==='start-date'&&e.target.value){S.start=e.target.value;save();render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='log-ex'){const s=readSets();const blank=s.every(x=>!x.w&&!x.r);syncLogDraft();const prev=exLogs(e.target.value).pop();
    ui.draft.sets=prev?prev.sets.map(x=>({w:x.w,r:x.r})):(blank?[{w:'',r:''}]:s);renderSheet()}
});
document.getElementById('photo-input').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
    const m=900,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    ui.draft.photo=c.toDataURL('image/jpeg',.72);renderSheet()};img.onerror=()=>toast('No se pudo leer esa imagen');img.src=rd.result};rd.readAsDataURL(f);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f-ex'){syncExDraft();const d=ui.draft;const name=d.name.trim();if(!name){toast('Escribe un nombre');return}
    if(d.id){Object.assign(getEx(d.id),{name,group:d.group,note:d.note.trim(),photo:d.photo})}
    else{const ex={id:uid(),name,group:d.group,note:d.note.trim(),photo:d.photo};S.exercises.push(ex);ui.ex=ex.id;ui.tab='detail';ui.sel=null}
    if(save()){ui.sheet=null;renderSheet();render();toast(d.id?'Cambios guardados':'Ejercicio agregado')}}
  if(e.target.id==='f-rt'){const days=ui.draft.days.filter(d=>d.groups.length).map(d=>({id:d.id,groups:d.groups.slice().sort((a,b)=>GROUPS.indexOf(a)-GROUPS.indexOf(b))}));
    if(!days.length&&ui.draft.days.length){toast('Elige al menos un grupo');return}
    S.routine={days,next:null};if(save()){ui.sheet=null;renderSheet();render();toast('Rutina guardada')}}
  if(e.target.id==='f-log'){syncLogDraft();const d=ui.draft;
    if(!d.exId){toast('Primero agrega un ejercicio');return}
    const sets=readSets().map(s=>({w:parseFloat(String(s.w).replace(',','.')),r:parseInt(s.r,10)})).filter(s=>s.w>=0&&s.r>0);
    if(!sets.length){toast('Agrega al menos una serie con repeticiones');return}
    if(S.routine)S.routine.next=null;
    S.logs.push({id:uid(),exId:d.exId,date:d.date||iso(today()),sets,note:d.note.trim()});
    if(parse(d.date)<parse(S.start))S.start=d.date;
    if(save()){ui.sheet=null;renderSheet();render();toast('Entrenamiento guardado')}}
});
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.handle');if(!h)return;e.preventDefault();
  const item=h.closest('.rt-day'),list=item.parentElement;item.classList.add('drag');
  try{h.setPointerCapture(e.pointerId)}catch(err){}
  const move=ev=>{const others=[...list.children].filter(x=>x!==item);let before=null;
    for(const o of others){const r=o.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=o;break}}
    if(before!==item.nextElementSibling)list.insertBefore(item,before)};
  const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
    item.classList.remove('drag');const order=[...list.children].map(x=>+x.dataset.i);ui.draft.days=order.map(i=>ui.draft.days[i]);renderSheet()};
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});
function exportBackup(){
  const name='home-gym-respaldo-'+iso(today())+'.json';
  const text=JSON.stringify({app:'mi-home-gym',version:1,exported:iso(today()),data:S});
  const blob=new Blob([text],{type:'application/json'});
  (async()=>{
    try{
      let file=null;try{file=new File([blob],name,{type:'application/json'})}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Respaldo Home Gym'});
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
      S.lastBackup=iso(today());save();if(ui.sheet==='settings')renderSheet();toast('Respaldo listo');
    }catch(e){if(e&&e.name==='AbortError')return;toast('No se pudo exportar el respaldo')}
  })();
}
document.getElementById('import-input').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);const d=j&&j.data?j.data:j;
      if(!d||!Array.isArray(d.exercises)||!Array.isArray(d.logs))throw 0;
      ui.pendingImport={...d,exported:j.exported||null};ui.confirm=null;renderSheet();
    }catch(err){toast('Ese archivo no es un respaldo de Home Gym')}};
  rd.onerror=()=>toast('No se pudo leer el archivo');rd.readAsText(f);
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(ui.tab==='detail')drawChart()},120)});
(async()=>{
  try{await DB.open();S=await DB.get(KEY);
    if(!S){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(S)DB.set(KEY,S).catch(()=>{})}}
  catch(e){DB.db=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(err){}}
  normalize();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
